<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<title>SENSORY DE-FREQ · QR เตียง</title>
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<link href="record.css" rel="stylesheet">
<style>
/* ป้าย QR ติดเตียง · พิมพ์ A5 แนวตั้ง 1 หน้า/เตียง (หรือ A4 ก็ได้ ขนาดจะขยายตาม) */
@page{size:A5 portrait;margin:0}
*{box-sizing:border-box}
html,body{margin:0;background:#888;font-family:var(--f);color:var(--ink)}
.pg{width:148mm;height:210mm;margin:10mm auto;background:var(--paper);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:14mm;page-break-after:always;break-after:page}
.lockup{font:12px var(--m);letter-spacing:.08em}
.bed{font:700 64px/1 var(--h);margin:8mm 0 2mm}
.qr svg{width:92mm;height:92mm;display:block}
.qr{background:#fff;padding:5mm;border:1px solid var(--rule);margin:6mm 0}
.t{font:700 20px var(--h);text-align:center}
.s{font:13px var(--f);color:var(--pencil);text-align:center;margin-top:2mm}
.u{font:10px var(--m);color:var(--pencil);margin-top:6mm;word-break:break-all;text-align:center}
@media print{html,body{background:none}.pg{margin:0}}
</style>
</head>
<body>
<div id="pages"></div>
<script src="vendor/qrcode.js"></script>
<script src="report_view.js"></script>
<script>
const url=n=>"https://babesnoopy.github.io/defreq/self.html?bed="+n;
document.getElementById("pages").innerHTML=[1,2,3].map(n=>`<section class="pg">
  <div class="lockup">UNSENSORY RESEARCH LAB / SENSORY DE-FREQ</div>
  <div class="bed">เตียง ${n}</div>
  <div class="qr">${RV.qrSvg(url(n),360)}</div>
  <div class="t">สแกนเพื่อทำแบบคัดกรองก่อนนอน</div>
  <div class="s">ส่งแล้วรอทีมกดรับเคส · หลังจบรอบ รีเฟรชหน้าเดิมเพื่อรับใบ report</div>
  <div class="u">${url(n)}</div></section>`).join("");
</script>
</body>
</html>
