<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>DE-FREQ · แฟ้มคัดกรอง</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DE-FREQ">
<meta name="theme-color" content="#2B2C2E">

<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--desk);color:var(--ink);font:16px/1.55 var(--f);-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}button{cursor:pointer}
:focus-visible{outline:3px solid var(--hl);outline-offset:2px}
/* ── แฟ้ม: แท็บบนสำหรับโหมด · แท็บข้างสำหรับเตียง ── */
.desk{padding:18px 64px 22px 22px;min-height:100vh;display:flex;flex-direction:column}
.toptabs{display:flex;gap:4px;margin-left:30px}
.toptabs .conn{margin-left:auto;align-self:center;font:12px var(--m);color:#A9ACB0;padding-right:8px}
.toptabs button{background:var(--folder2);color:#A9ACB0;border:0;border-radius:10px 10px 0 0;padding:8px 22px 6px;font:500 14px var(--h)}
.toptabs button.on{background:var(--folder);color:#fff}
.folder{position:relative;flex:1;background:var(--folder);border-radius:4px 16px 16px 16px;padding:22px 26px 26px 22px;display:flex}
.sidetabs{position:absolute;right:-44px;top:40px;display:flex;flex-direction:column;gap:6px}
.sidetabs button{writing-mode:vertical-rl;background:var(--tab);border:0;border-radius:0 10px 10px 0;padding:16px 8px;font:500 14px var(--h);color:var(--ink);box-shadow:inset 3px 0 0 rgba(0,0,0,.12);display:flex;align-items:center;gap:8px}
.sidetabs button.on{background:var(--paper);box-shadow:none;transform:translateX(-4px)}
.sidetabs .dot{width:10px;height:10px;border-radius:50%;border:1.5px solid #8A8D91;background:transparent}
.dot.ok{background:var(--ink);border-color:var(--ink)}.dot.warn{background:linear-gradient(90deg,var(--ink) 50%,transparent 50%);border-color:var(--ink)}.dot.stop{background:transparent;border:0;border-radius:0;width:12px;height:12px;background:linear-gradient(45deg,transparent 42%,var(--ink) 42%,var(--ink) 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--ink) 42%,var(--ink) 58%,transparent 58%)}
/* ── แผ่นกระดาษ ── */
.sheet{position:relative;flex:1;background:var(--paper);border-radius:3px;padding:30px 40px 0;display:flex;flex-direction:column;box-shadow:6px 6px 0 var(--paper2),7px 7px 0 var(--rule);max-height:calc(100vh - 92px);overflow:auto}
.clip{position:absolute;left:18px;top:-14px;width:22px;height:70px;border:3px solid #9AA0A3;border-radius:12px;border-bottom-color:transparent;z-index:2}
.cross{position:absolute;width:18px;height:18px}
.cross::before,.cross::after{content:"";position:absolute;background:var(--pencil)}.cross::before{left:8px;top:0;width:1px;height:18px}.cross::after{top:8px;left:0;height:1px;width:18px}
.cross.tr{right:14px;top:14px}.cross.br{right:14px;bottom:14px}
.head{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.title{font:700 46px/1.02 var(--h);margin:6px 0 2px;letter-spacing:-.01em}
.title .hand{font:400 40px var(--hand);color:var(--pen);margin-left:10px}
.sub{font:13px var(--m);color:var(--pencil);border-bottom:1.5px solid var(--ink);padding-bottom:10px}
.regno{font:12px/1.6 var(--m);text-align:right;color:var(--pencil);white-space:nowrap}
/* ── หัวข้อ 01–05 แบบเช็กลิสต์ในแฟ้ม ── */
.sec{border-bottom:1px solid var(--rule)}
.row{display:grid;grid-template-columns:22px 64px 1fr auto;align-items:center;gap:10px;width:100%;background:none;border:0;padding:12px 0;text-align:left}
.row .pin{width:8px;height:8px;background:var(--ink);justify-self:center}
.row .no{font:44px/1 var(--disp);position:relative}
.row .lbl b{display:inline-block;font:700 19px var(--h)}.row .lbl small{display:block}
.row .lbl small{font:13px var(--f);color:var(--pencil)}
.box{width:30px;height:30px;border:1.5px solid var(--ink);display:grid;place-items:center;font:28px/1 var(--hand);color:var(--pen)}
.sec.cur .no,.sec.cur .lbl b{background:var(--ink);color:var(--paper);padding:0 8px;margin-left:-8px}
.sec.lock .row{opacity:.42}
.body{padding:2px 0 22px 96px}
/* ── คำตอบ: ลายมือปากกาน้ำเงิน ── */
.q{display:grid;grid-template-columns:230px 1fr;gap:6px 18px;padding:10px 0;border-top:1px dashed var(--fine)}
.q:first-child{border-top:0}
.q>label{font-weight:500;padding-top:6px}.q>label small{display:block;font-weight:400;font-size:13px;color:var(--pencil)}
.line{border:0;border-bottom:1.5px solid var(--ink);background:transparent;font:28px var(--hand);color:var(--pen);padding:0 4px;width:260px}
.opts{display:flex;flex-wrap:wrap;gap:6px 16px}
.opt{display:flex;align-items:center;gap:8px;background:none;border:0;padding:6px 2px;font-size:15px}
.opt i{width:22px;height:22px;border:1.5px solid var(--ink);display:grid;place-items:center;font:22px/1 var(--hand);font-style:normal;color:var(--pen)}
.opt.on span{font-family:var(--hand);color:var(--pen);font-size:18px}
.scale{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--pencil)}
.scale button{width:42px;height:42px;border-radius:50%;border:1.5px solid var(--ink);background:transparent;font:500 16px var(--m)}
.scale button.on{background:transparent;color:var(--pen);border:2.5px solid var(--pen);font:400 22px var(--hand)}
.yn{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:9px 0;border-top:1px dashed var(--fine)}
.yn:first-child{border-top:0}.yn small{display:block;color:var(--pencil);font-size:13px}
.seg{display:flex;gap:14px}
.consent{display:flex;gap:12px;align-items:flex-start;padding:8px 0;background:none;border:0;text-align:left;width:100%}
.nav{display:flex;justify-content:flex-end;gap:10px;padding-top:12px}
.btn{padding:11px 22px;border:1.5px solid var(--ink);background:transparent;font:600 15px var(--h);border-radius:2px}
.btn.pri{background:var(--ink);color:var(--paper)}
.btn:disabled{opacity:.3;cursor:not-allowed}
/* ── ตรายาง ── */
.fit{display:grid;grid-template-columns:100px 1fr 50px;gap:6px 12px;align-items:center;font:14px var(--m);max-width:520px}
.fit i{height:12px;border:1px solid var(--ink);display:block}.fit i b{display:block;height:100%}
.notes{margin:8px 0 0;padding-left:18px;font-family:var(--hand);color:var(--pen);font-size:18px}
.foot{margin-top:auto;display:grid;grid-template-columns:1fr 1fr 1fr;border-top:1.5px solid var(--ink);padding:10px 0 16px;font:11px/1.5 var(--m);color:var(--pencil)}
.foot b{display:block;color:var(--ink);font-weight:500;font-size:12px}
.empty{padding:70px 0;text-align:center}
.empty .hand{font:30px var(--hand);color:var(--pen)}
/* ── ใบสรุปรอบ ── */
.bedline{display:grid;grid-template-columns:64px 1fr 200px 160px;gap:14px;align-items:center;padding:14px 0;border-bottom:1px solid var(--rule)}
.bedline .no{font:44px/1 var(--disp)}
.bedline .nm{font:28px var(--hand);color:var(--pen)}
.verdictbig{display:flex;align-items:center;gap:26px;margin:22px 0 6px}
.verdictbig .set{font:72px/1 var(--disp);letter-spacing:.01em}
/* ── บัตร / รายงาน ── */
.overlay{position:fixed;inset:0;background:rgba(10,12,11,.82);display:grid;place-items:center;z-index:9;padding:20px;overflow:auto}
.keep{display:flex;gap:16px;align-items:center;margin-top:18px;background:var(--paper);padding:12px 16px;border-radius:10px;max-width:420px}
.keep b{display:block;font:700 15px var(--h)}.keep span{display:block;font-size:13px;color:var(--pencil);margin-bottom:8px}
#shot img{max-width:300px;margin-top:14px;border-radius:12px}#shot p{color:#ddd;font-size:13px;text-align:center}
.inq{margin-left:10px;background:var(--ink);color:var(--paper);border:0;border-radius:2px;padding:6px 12px;font:700 14px var(--h)}
.inq.has{background:#C0392B;animation:inq 1.2s infinite}@keyframes inq{50%{opacity:.6}}
.inq.ghost{background:none;color:inherit;border:1px solid currentColor;font-weight:500}
.case{background:var(--paper);border-radius:6px;padding:14px 16px;width:min(560px,92vw);margin-bottom:10px}
.case .hd{display:flex;align-items:center;gap:12px}.case .hd b{font:700 20px var(--h)}.case .hd small{color:var(--pencil);font:12px var(--m)}
.case ul{margin:8px 0 0;padding-left:18px;font-size:14px}
.case .act{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px;align-items:center}
.case .act button{border:1px solid var(--ink);background:#fff;color:var(--ink);border-radius:2px;padding:8px 12px;font:700 14px var(--h)}
.case .act button.pri{background:var(--ink);color:var(--paper)}.case .act button[disabled]{opacity:.35}
.qrs{display:flex;gap:14px;flex-wrap:wrap;justify-content:center}
.qrs div{background:var(--paper);border-radius:8px;padding:14px;text-align:center;font:700 18px var(--h)}
.close{margin-top:16px;color:#ddd;background:none;border:1px solid #666;padding:8px 18px;border-radius:2px}
@media (max-width:900px){.desk{padding:10px 50px 10px 8px}.body{padding-left:0}.q{grid-template-columns:1fr}.title{font-size:34px}}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="desk">
  <div class="toptabs" id="modes"></div>
  <div class="folder"><div class="sidetabs" id="tabs"></div><div class="sheet" id="sheet"></div></div>
</div>
<div id="ov"></div>
<script src="vendor/html2canvas.min.js"></script>
<script src="vendor/qrcode.js"></script>
<script src="report_view.js"></script>
<script src="intake_core.js"></script>
<script>
const $=s=>document.querySelector(s);
const SETS={baseline:{name:"BASELINE",th:"ตั้งศูนย์",color:"var(--baseline)",hex:"#0FA3BF"},boost:{name:"BOOST",th:"ปลุกพลัง",color:"var(--boost)",hex:"#E8265E"},relax:{name:"RELAX",th:"ปล่อยวาง",color:"var(--relax)",hex:"#2DB3A8"}};
const STEPS=["ข้อมูลและความยินยอม","ความปลอดภัย","เช็กอินร่างกาย","ช่วงนี้เป็นยังไง","ผลคัดกรอง"];
// คำถาม/กติกาคัดกรองอยู่ใน intake_core.js (ใช้ร่วมกับหน้ามือถือ self.html)
const {SAFETY,MOOD,WEATHER,WANT,CONSENT,blank,triage,fit}=IC;
const R={id:"R-"+new Date().toISOString().slice(5,10).replace("-","")+"-07",beds:[blank(),blank(),blank()],cur:0,view:"intake",confirmed:null};
// ตัวอย่างข้อมูล 2 เตียง ให้เห็นภาพรวม
Object.assign(R.beds[1],{step:4,nick:"มุก",age:"25-34",consent:{sensor:true,data:true,photo:false},safety:{seizure:false,implant:false,migraine:true,pregnant:false,skin:false,space:false,alcohol:false,sound:false},energy:2,stress:4,busy:5,sleepy:3,sleep:"5-6",caffeine:"2",mood:["งานถาโถม","คิดเยอะ"],weather:"storm",want:"rest"});
Object.assign(R.beds[2],{step:4,nick:"ต้น",age:"18-24",consent:{sensor:true,data:true,photo:true},safety:{seizure:false,implant:false,migraine:false,pregnant:false,skin:false,space:false,alcohol:false,sound:false},energy:2,stress:2,busy:3,sleepy:4,sleep:"7-8",caffeine:"0",mood:["เบื่อๆ","ใจลอย"],weather:"cloud",want:"energy"});

/* ── คำนวณ ── */
function roundPick(){
  const ppl=R.beds.map(p=>({p,tr:triage(p),f:fit(p)})).filter(x=>x.tr.lvl&&x.tr.lvl!=="stop"&&x.f);
  if(!ppl.length)return null;
  const sum={baseline:0,boost:0,relax:0};ppl.forEach(x=>{for(const k in sum)sum[k]+=x.f[k]});
  const n=ppl.length;for(const k in sum)sum[k]=Math.round(sum[k]/n);
  const has=t=>ppl.some(x=>x.tr.notes.some(n=>n.includes(t))),noBoost=has("ไม่แนะนำ BOOST");
  const order=Object.keys(sum).sort((a,b)=>sum[b]-sum[a]);let pick=order[0],why="";
  if(pick==="boost"&&noBoost){pick=order[1];why=`BOOST ได้คะแนนสูงสุด แต่มีคนที่ไม่ควรเจอแสงจัด เลยใช้ ${SETS[pick].name} แทน`}
  else{const top=ppl.filter(x=>Object.keys(x.f).sort((a,b)=>x.f[b]-x.f[a])[0]===pick).map(x=>x.p.nick||"ไม่มีชื่อ");why=`${top.join(", ")||"กลุ่ม"} ต้องการ${SETS[pick].th}มากที่สุด · เฉลี่ยจาก ${n} คน`}
  const flags=[];if(has("ลดแสงกะพริบ"))flags.push("ลดแสงกะพริบทั้งรอบ");
  return {sum,pick,why,flags,noBoost}}

function trace(seed,n,base,amp){let x=base,o=[];for(let i=0;i<n;i++){x+=(Math.sin(i*.37+seed)*.5+Math.sin(i*.11+seed*2)*.8)*amp*.12;x=x*.97+base*.03;o.push(x)}return o}
function qrFake(){let s="";const fin=(x,y)=>`<rect x="${x}" y="${y}" width="7" height="7" fill="#121212"/><rect x="${x+1}" y="${y+1}" width="5" height="5" fill="#fff"/><rect x="${x+2}" y="${y+2}" width="3" height="3" fill="#121212"/>`;
  s+=fin(0,0)+fin(14,0)+fin(0,14);for(let y=0;y<21;y++)for(let x=0;x<21;x++){if((x<8&&y<8)||(x>12&&y<8)||(x<8&&y>12))continue;if(((x*7+y*13+x*y)%5)<2)s+=`<rect x="${x}" y="${y}" width="1" height="1" fill="#121212"/>`}return s}

for(const k in SETS){SETS[k].color="var(--ink)";SETS[k].hex="var(--ink)"}
R.tab=2;R.view="intake";R.beds[1].max=4;R.beds[2].max=4;R.beds[0]._start=false;
const TH_DATE=()=>new Date().toLocaleDateString("th-TH",{day:"2-digit",month:"2-digit",year:"numeric"});
const SECS=[["ข้อมูลและความยินยอม","ใครมา และยินยอมอะไรบ้าง"],["ความปลอดภัย","มีอะไรที่ต้องระวังไหม"],["เช็กอินร่างกาย","ตอนนี้ร่างกายเป็นยังไง"],["ช่วงนี้เป็นยังไง","อาการสำคัญที่มาในวันนี้"],["ผลคัดกรอง","ผ่านไหม และเหมาะกับเซ็ตไหน"]];
const hn=i=>R.beds[i].hn||(LIVE?"—":"UNS-0"+(426+i));
let LIVE=false;
function canNext(p){return [p.nick&&p.age&&p.age!=="<18"&&p.consent.sensor&&p.consent.data,SAFETY.every(q=>p.safety[q.k]!==undefined),p.energy&&p.stress&&p.busy&&p.sleepy&&p.sleep&&p.caffeine,p.weather&&p.want,true][p.step]}
const opts=(name,list,val,multi)=>`<div class="opts">${list.map(x=>{const[k,l]=Array.isArray(x)?x:[x,x];const on=multi?val.includes(k):val===k;return `<button class="opt ${on?"on":""}" data-ch="${name}" data-k="${k}"><i>${on?"✓":""}</i><span>${l}</span></button>`}).join("")}</div>`;
const scale=(name,lo,hi,val)=>`<div class="scale"><span>${lo}</span>${[1,2,3,4,5].map(n=>`<button class="${val===n?"on":""}" data-sc="${name}" data-n="${n}" aria-label="${n}">${n}</button>`).join("")}<span>${hi}</span></div>`;
function secBody(p,i){
  if(i===0)return `<div class="q"><label for="nick">ชื่อเล่น</label><input class="line" id="nick" value="${p.nick}" autocomplete="off" placeholder="…"></div>
    <div class="q"><label>ช่วงอายุ</label><div>${opts("age",[["<18","ต่ำกว่า 18"],"18-24","25-34","35-44","45+"],p.age)}${p.age==="<18"?`<div class="notes">ต้องมีผู้ปกครองเซ็นยินยอมที่บูธก่อน</div>`:""}</div></div>
    <div class="q"><label>ความยินยอม<small>ให้ผู้ร่วมติ๊กเอง</small></label><div>
      ${CONSENT.map(([k,t])=>`<button class="consent opt ${p.consent[k]?"on":""}" data-cs="${k}"><i>${p.consent[k]?"✓":""}</i><span style="font-family:var(--f);font-size:15px;color:var(--ink)">${t}</span></button>`).join("")}</div></div>`;
  if(i===1)return `<p class="kicker" style="margin:0 0 6px">ถามทีละข้อ ไม่แน่ใจให้ตอบ "ใช่" ไว้ก่อน · คำตอบหมวดนี้ไม่ถูกเก็บ เก็บแค่ผลคัดกรอง</p>${SAFETY.map(q=>`<div class="yn"><span>${q.t}${q.s?`<small>${q.s}</small>`:""}</span><span class="seg">
     <button class="opt ${p.safety[q.k]===false?"on":""}" data-sf="${q.k}" data-v="0"><i>${p.safety[q.k]===false?"✓":""}</i><span>ไม่ใช่</span></button>
     <button class="opt ${p.safety[q.k]===true?"on":""}" data-sf="${q.k}" data-v="1" style="${p.safety[q.k]===true?`--pen:${q.lvl==="stop"?"var(--stop)":"var(--warn)"}`:""}"><i>${p.safety[q.k]===true?"✓":""}</i><span>ใช่</span></button></span></div>`).join("")}`;
  if(i===2)return `<div class="q"><label>พลังงานตอนนี้</label>${scale("energy","หมดแรง","เต็มถัง",p.energy)}</div>
    <div class="q"><label>ความเครียด</label>${scale("stress","สบายๆ","ตึงมาก",p.stress)}</div>
    <div class="q"><label>ในหัวมีเรื่องวนแค่ไหน</label>${scale("busy","โล่ง","วนไม่หยุด",p.busy)}</div>
    <div class="q"><label>ง่วงแค่ไหน</label>${scale("sleepy","ตาสว่าง","จะหลับ",p.sleepy)}</div>
    <div class="q"><label>เมื่อคืนนอนกี่ชั่วโมง</label>${opts("sleep",["≤4","5-6","7-8","9+"],p.sleep)}</div>
    <div class="q"><label>กาแฟหรือชาวันนี้</label>${opts("caffeine",[["0","ไม่ได้ดื่ม"],["1","1 แก้ว"],["2","2 แก้ว"],["3+","3 แก้วขึ้นไป"]],p.caffeine)}</div>`;
  if(i===3)return `<div class="q"><label>ช่วงนี้ชีวิตเป็นยังไง<small>เลือกได้หลายข้อ</small></label>${opts("mood",MOOD,p.mood,true)}</div>
    <div class="q"><label>ถ้าใจตอนนี้เป็นสภาพอากาศ</label>${opts("weather",WEATHER,p.weather)}</div>
    <div class="q"><label>อยากได้อะไรจาก 5 นาทีนี้</label>${opts("want",WANT,p.want)}</div>`;
  const tr=triage(p),f=fit(p);const lab={ok:"ผ่าน",warn:"ผ่าน · มีเงื่อนไข",stop:"ร่วมไม่ได้"}[tr.lvl]||"ยังไม่ครบ";
  return `<div style="display:flex;gap:30px;align-items:flex-start;flex-wrap:wrap"><div class="stamp ${tr.lvl}">${lab}</div>
   <div style="flex:1;min-width:280px">${tr.notes.length?`<b>สิ่งที่ต้องปรับ</b><ul class="notes">${tr.notes.map(n=>`<li>${n}</li>`).join("")}</ul>`:`<b>ไม่มีข้อห้าม</b> ร่วมได้ตามปกติ`}
   ${f&&tr.lvl!=="stop"?`<div style="margin-top:14px"><b>เหมาะกับเซ็ตไหน</b><div class="fit" style="margin-top:6px">${Object.keys(SETS).map(k=>`<span>${SETS[k].name}</span><i><b style="width:${f[k]}%;background:${SETS[k].color}"></b></i><span>${f[k]}%</span>`).join("")}</div></div>`:""}</div></div>

async function api(path,body){

  if(r.status===401){askPin();return api(path,body)}

async function rpc(fn,args,tries=0){
  const r=await fetch(`${SB.url}/rest/v1/rpc/${fn}`,{method:"POST",cache:"no-store",
    headers:{apikey:SB.key,Authorization:`Bearer ${SB.key}`,"Content-Type":"application/json","Content-Profile":"unsensory"},
    body:JSON.stringify({p_pin:pinGet(),p_booth:SB.booth,...args})});
  const d=await r.json().catch(()=>null);
  if(!r.ok)throw new Error((d&&d.message)||("ระบบตอบกลับ "+r.status));
  if(d&&d.error==="pin"){if(tries>2)throw new Error("PIN ไม่ถูก");askPin(tries?"PIN ไม่ถูก ลองใหม่อีกครั้ง":undefined);return rpc(fn,args,tries+1)}

  const rs=$("#resend");if(rs)rs.onclick=()=>sendBed(i);
  const tr=$("#toReport");if(tr)tr.onclick=async()=>{if(LIVE){tr.disabled=true;try{hydrate(await B.post(i+1,p.post))}catch(e){alert(e.message)}}overlay(reportHtml(i))}}
/* ── เคสจากมือถือ (QR ที่เตียง → self.html) ── รอทีมกดรับ · ใช้ได้ในโหมด cloud */
const SELF_URL=n=>"https://babesnoopy.github.io/defreq/self.html?bed="+n;
let INBOX=[],INBOX_OPEN=false;
const TRI={ok:"ผ่าน",warn:"ทีมปรับให้",stop:"ร่วมนอนไม่ได้"};
function drawInbox(){if(!INBOX_OPEN)return;
  const occ=n=>{const p=R.beds[n-1];return p&&p._sent&&p.nick?p.nick:""};
  const cases=INBOX.map(c=>{const p=c.p||{},t=p.triage,mins=Math.max(0,Math.round((Date.now()-new Date(c.at))/60000));
    return `<div class="case"><div class="hd"><span class="stamp ${t}">${TRI[t]||t}</span><b>${RV.esc(p.nick||"")}</b><small>อายุ ${RV.esc(p.age||"")} · สแกนจากเตียง ${c.bed} · ${mins} นาทีก่อน</small></div>
      ${(p.notes||[]).length?`<ul>${p.notes.map(x=>`<li>${RV.esc(x)}</li>`).join("")}</ul>`:""}
      <div class="act">${t==="stop"?`<span style="font-size:13px">ร่วมนอนไม่ได้ · ไปคุยกับผู้เข้าร่วม แล้วกดรับทราบ (ไม่ใส่เตียง)</span><button class="pri" data-rej="${c.id}" data-ack="1">รับทราบ</button>`
        :[1,2,3].map(n=>`<button class="${n===c.bed?"pri":""}" data-acc="${c.id}" data-bed="${n}">รับเข้าเตียง ${n}${occ(n)?" · มี "+RV.esc(occ(n))+" อยู่":""}</button>`).join("")}
      ${t==="stop"?"":`<button data-rej="${c.id}">ไม่รับ</button>`}</div></div>`}).join("");
  overlay(`${cases||`<p style="color:#ddd">ยังไม่มีเคสรอรับ</p>`}<button class="close" id="ovx">ปิด</button>`);
  $("#ovx").onclick=()=>{INBOX_OPEN=false;$("#ov").innerHTML=""};
  document.querySelectorAll("[data-acc]").forEach(b=>b.onclick=async()=>{const n=+b.dataset.bed,who=occ(n);
    if(who&&!confirm(`เตียง ${n} มี ${who} อยู่แล้วในรอบนี้ · แทนที่ด้วยเคสนี้?`))return;
    document.querySelectorAll("[data-acc],[data-rej]").forEach(x=>x.disabled=true);
    try{const S=await rpc("staff_accept",{p_id:b.dataset.acc,p_bed:n});const a=S.accepted||{};
      try{localStorage.setItem(`defreq.notes.${S.id}.${a.bed||n}`,JSON.stringify(a.notes||[]))}catch(e){}
      R.beds[(a.bed||n)-1]=blank();hydrate(S);R.tab=a.bed||n;R.view="intake"}catch(e){alert(e.message)}
    await pollInbox();draw();drawInbox()});
  document.querySelectorAll("[data-rej]").forEach(b=>b.onclick=async()=>{if(!b.dataset.ack&&!confirm("ไม่รับเคสนี้? มือถือของผู้เข้าร่วมจะขึ้นให้ติดต่อทีมที่บูธ"))return;
    try{await rpc("staff_reject",{p_id:b.dataset.rej})}catch(e){alert(e.message)}await pollInbox();draw();drawInbox()})}
async function pollInbox(){if(!LIVE||MODE!=="cloud")return;
  try{const d=await rpc("staff_pending",{});if(Array.isArray(d)){const ch=JSON.stringify(d.map(c=>c.id))!==JSON.stringify(INBOX.map(c=>c.id));INBOX=d;
    if(ch){const a=document.activeElement;if(INBOX_OPEN)drawInbox();else if(!$("#ov").innerHTML&&!(a&&a.tagName==="INPUT"))draw()}}}catch(e){}}
setInterval(()=>{if(!document.hidden)pollInbox()},4000);
draw();
(async()=>{const q=new URLSearchParams(location.search);
  try{if(q.has("demo"))throw 0;let S=null;
    try{const r=await fetch("api/round",{cache:"no-store",headers:{"X-Pin":pinGet()}});if(r.ok||r.status===401){MODE="local";S=await api("api/round")}}catch(e){}
    if(!S){if(location.protocol!=="https:"||/claude/.test(location.hostname))throw 0;MODE="cloud";if(!pinGet())askPin();S=await B.round()}
    LIVE=true;R.beds=[blank(),blank(),blank()];R.tab=1;R.view="intake";hydrate(S);document.title="Sensory De-Freq · แฟ้มคัดกรอง"}catch(e){}draw()})();
</script>
</body>
